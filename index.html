<style>
:root{--ink:#14211a;--mu:#5d6e63;--leaf:#0f3d2a;--l2:#16553a;--lime:#c6f432;--bg:#edf2ea;--line:#d9e2d6;--in:#0f7a4a;--out:#e63757;--soft:#f5f8f3;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.d{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
/* ===== Login ===== */
#auth{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#1d6b49,var(--leaf) 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + var(--st)) 20px calc(20px + var(--sb));overflow:auto;z-index:20}
.logo{width:min(230px,62vw);min-height:80px;display:grid;place-items:center;margin-bottom:18px;animation:pop 1.1s cubic-bezier(.34,1.56,.64,1) both,fl 3.2s 1.2s ease-in-out infinite}
.logo img{width:100%;max-height:130px;object-fit:contain}
.logo b{font:800 32px 'Bricolage Grotesque',sans-serif;color:var(--lime);text-align:center;line-height:1}
@keyframes pop{0%{transform:scale(0) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:none}}
@keyframes fl{50%{transform:translateY(-8px)}}
#ac{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:22px 22px 18px;animation:up .7s .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#ac.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#ac h2{font-size:22px;font-weight:800}
.err,.ok{border-radius:9px;padding:9px 12px;font-size:13.5px;margin-top:12px}
.err{background:#fde8ec;color:#a3112b}.ok{background:#e4f5ea;color:var(--in)}
.lk{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13.5px}
.lk a{color:var(--l2);font-weight:600;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--mu)}
/* ===== Loader jus ===== */
#ld{text-align:center;color:#fff}
#ld svg{width:170px;overflow:visible;display:block;margin:0 auto}
#fr{font-size:46px;height:56px;animation:bn .6s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(10px) rotate(8deg)}}
#pc{font:800 46px 'Bricolage Grotesque',sans-serif;color:var(--lime);margin-top:6px}
#jw{transition:fill .5s}
.wv{animation:wv 1.2s linear infinite}
@keyframes wv{to{transform:translateX(-60px)}}
/* ===== App ===== */
#app{max-width:1000px;margin:0 auto;padding:calc(14px + var(--st)) 14px calc(90px + var(--sb))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.top h1{font-size:26px;font-weight:800}
.who{color:var(--mu);font-size:13px;margin-right:6px}
.ib{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer}
.period{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;width:max-content;max-width:100%;overflow:auto}
.period button{border:0;background:0;padding:6px 13px;border-radius:999px;color:var(--mu);font-weight:500;white-space:nowrap}
.period button.on{background:var(--leaf);color:#fff}
#view>*{animation:fi .35s both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:14px}
.card h2{font-size:17px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{margin:0;padding:14px}.kpi span{color:var(--mu);font-size:13px}
.kpi strong{display:block;font:700 21px 'Bricolage Grotesque',sans-serif;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--mu)}.up{color:var(--in)!important}.down{color:var(--out)!important}
.kpi.main{background:var(--leaf);border-color:var(--leaf);color:#fff}.kpi.main strong{color:var(--lime)}.kpi.main span,.kpi.main em{color:#a9cdb7}
.rack{background:var(--leaf);color:#fff;border-radius:22px;padding:20px 18px 0;overflow:hidden;margin-top:14px}
.rack h2{font-size:26px;font-weight:800;line-height:1.1}.rack p{color:#a9cdb7}
.shelf{display:flex;gap:8px;align-items:flex-end;margin:16px 0 0;overflow-x:auto;padding-bottom:0}
.glass{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:4px}
.glass b{font:700 18px 'Bricolage Grotesque',sans-serif}.glass span{font-size:12px;color:#cfe5d6;padding-bottom:10px}
.glass.top1 span{color:var(--lime);font-weight:600}
.bt{width:44px;display:flex;flex-direction:column;align-items:center}
.cap{width:20px;height:8px;background:#fff;border-radius:3px 3px 1px 1px}
.nk{width:17px;height:18px;border:2px solid #ffffffbf;border-bottom:0}
.bd{width:44px;height:84px;position:relative;overflow:hidden;border:2px solid #ffffffbf;border-radius:20px 20px 10px 10px/24px 24px 10px 10px;background:#ffffff12}
.bd::after{content:"";position:absolute;left:0;right:0;top:46%;height:24%;background:#ffffff8c}
.lq{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.shelf::after{content:"";flex:none}
.cb{position:relative;height:260px}.cb.sm{height:220px}canvas{touch-action:pan-y}
.feed{list-style:none}.feed li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef2ec}
.feed li:last-child{border:0}.feed b{display:block;font-weight:600}.feed small{color:var(--mu)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.empty{padding:26px 8px;text-align:center;color:var(--mu)}
.bar{margin-top:9px}.bar small{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:3px}
.bar i{display:block;height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;background:var(--out);border-radius:9px;transition:width .8s}
label.f{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px}
.inp{width:100%;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.inp:focus{outline:0;border-color:var(--l2);background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:500}
.chip i{width:13px;height:13px;border-radius:50%;border:1px solid #0003}.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stp{display:flex;gap:6px}.stp button{width:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px}.stp input{text-align:center;font-weight:700}
.tot{margin-top:14px;background:var(--soft);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.tot strong{font:700 23px 'Bricolage Grotesque',sans-serif}
.btn{width:100%;margin-top:14px;background:var(--leaf);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6}.btn.red{background:var(--out)}
.del{background:0;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:4px 10px;font-size:12.5px}
.del.arm{background:var(--out);border-color:var(--out);color:#fff}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.fl .inp{flex:1;min-width:130px;width:auto}
#nav{position:fixed;left:0;right:0;bottom:0;max-width:1000px;margin:0 auto;display:flex;background:var(--leaf);padding:6px 6px calc(6px + var(--sb));border-radius:18px 18px 0 0;z-index:10}
#nav button{flex:1;background:0;border:0;color:#bcd8c6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:7px 2px;border-radius:12px}
#nav button.on{background:var(--lime);color:var(--leaf);font-weight:600}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.e{background:var(--out)}
.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="auth">
  <div class="logo"><img src="https://lh3.googleusercontent.com/d/1HWOv0ozL_wmo7z8rm45eTB0n3J6nbUfM" alt="Buah Tetangga" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><b hidden>BUAH<br>TETANGGA</b></div>
  <div id="ac"></div>
  <div id="ld" hidden>
    <div id="fr">🍓</div>
    <svg viewBox="0 0 120 160"><defs><clipPath id="gc"><path d="M16 14h88l-10 130q-1 10-11 10H37q-10 0-11-10z"/></clipPath></defs>
      <g clip-path="url(#gc)"><g id="jl" transform="translate(0 152)"><g class="wv"><path id="jw" d="M0 8q15-10 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0V200H0z" fill="#e63757"/></g></g></g>
      <path d="M16 14h88l-10 130q-1 10-11 10H37q-10 0-11-10z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M80 14l16-24" stroke="#c6f432" stroke-width="5" stroke-linecap="round"/></svg>
    <div id="pc">0%</div><p id="lt">Memetik buah…</p>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><h1 id="title"></h1><div><span class="who" id="who"></span><button class="ib" id="rf" title="Muat ulang">⟳</button> <button class="ib" id="out">Keluar</button></div></header>
  <div class="period" id="period"><button data-p="7">7 hari</button><button data-p="30">30 hari</button><button data-p="bulan">Bulan ini</button><button data-p="semua">Semua</button></div>
  <div id="view"></div>
</div>
<nav id="nav" hidden></nav>
<div id="toast"></div>

<script>
/* ===== PENGATURAN: tempel URL Web App Apps Script (yang berakhiran /exec) ===== */
const API = 'https://script.google.com/macros/s/AKfycbz3v80o7al48LmT2esZ8hfRl_UAeyzQ39-XVJL1o5f929CXD5q1Oe1caaE_kIgtx4Bv/exec';

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rp = n => (n < 0 ? '-Rp' : 'Rp') + Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0'), ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const tgl = (s, o) => new Date(s + 'T12:00:00').toLocaleDateString('id-ID', o || { day: 'numeric', month: 'short' });
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0), sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = { g: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, s: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }, d: k => { try { localStorage.removeItem(k) } catch (e) {} } };
const TK = 'bt_token', DK = 'bt_data', METODE = ['Tunai', 'QRIS', 'Transfer'], KAT = ['Buah-buahan', 'Botol', 'Stiker', 'BBM / Ongkir', 'Es Batu', 'Lainnya'];
let A = { token: '', user: '' }, S = { produk: [], pemasukan: [], pengeluaran: [] }, view = 'ringkasan', period = '7', draft = { jus: '', qty: 1, harga: 0 }, AM = 'login', authId = '';

/* ===== API ke Apps Script (text/plain = tanpa preflight CORS) ===== */
async function call(fn, ...a) {
  if (API.includes('GANTI_DENGAN')) throw new Error('Isi dulu konstanta API di index.html.');
  if (fn.startsWith('api_')) a.unshift(A.token);
  let j;
  try { j = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args: a }) })).json(); }
  catch (e) { throw new Error('Tidak bisa terhubung. Periksa koneksi internet.'); }
  if (!j.ok) { if (/SESI_HABIS/.test(j.error) && A.token) logout('Sesi berakhir, silakan masuk lagi.'); throw new Error(j.error); }
  return j.data;
}
const saveS = () => LS.s(DK, JSON.stringify(S));
let tt; function toast(m, e) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (e ? ' e' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 2600); }

/* ===== Loader jus 0–100% ===== */
const FR = [['🍓', '#e63757'], ['🥝', '#7bc043'], ['🥭', '#ffb000'], ['🍊', '#ff7a00'], ['🍍', '#f4d03f']];
let tg = 0, sh = 0, cap = 0, raf = 0, tm = 0, fin = null, lastI = -1, lastP = -1;
function ldOn() {
  $('#ac').hidden = true; $('#ld').hidden = false; tg = sh = 0; cap = 55; fin = null; lastI = lastP = -1;
  clearInterval(tm); tm = setInterval(() => tg = Math.min(cap, tg + 1.3), 90);
  cancelAnimationFrame(raf);
  const step = () => {
    if (sh < tg) sh = Math.min(tg, sh + Math.max(.2, (tg - sh) * .07));
    const p = Math.round(sh), i = Math.min(4, Math.floor(p / 20));
    if (p !== lastP) { lastP = p; $('#pc').textContent = p + '%'; $('#jl').setAttribute('transform', `translate(0 ${152 - p * 1.36})`); $('#lt').textContent = p < 30 ? 'Memetik buah…' : p < 60 ? 'Memeras jus…' : p < 90 ? 'Menuang ke gelas…' : 'Siap diminum!'; }
    if (i !== lastI) { lastI = i; $('#fr').textContent = FR[i][0]; $('#jw').setAttribute('fill', FR[i][1]); }
    if (sh >= 100) { clearInterval(tm); return fin && fin(); }
    raf = requestAnimationFrame(step);
  };
  step();
}
const ldDone = () => new Promise(ok => { fin = ok; cap = tg = 100; });
const ldOff = () => { clearInterval(tm); cancelAnimationFrame(raf); };

/* ===== Layar login ===== */
const M = {
  login: { t: 'Masuk', s: 'Masuk untuk membuka dashboard.', b: 'Masuk', f: [['u', 'Username atau email', 'text', 'autocapitalize=none autocomplete=username'], ['p', 'Password', 'password', 'autocomplete=current-password']], l: [['lupa', 'Lupa password?'], ['daftar', 'Daftar akun baru']] },
  daftar: { t: 'Daftar', s: 'Buat akun untuk mengakses dashboard.', b: 'Daftar', f: [['u', 'Username', 'text', 'autocapitalize=none autocomplete=username'], ['e', 'Email', 'email', 'autocomplete=email'], ['p', 'Password (min. 8 karakter)', 'password', 'autocomplete=new-password'], ['p2', 'Ulangi password', 'password', 'autocomplete=new-password'], ['k', 'Kode pendaftaran', 'text', 'autocomplete=off']], l: [['login', 'Sudah punya akun? Masuk']] },
  lupa: { t: 'Lupa password', s: 'Kode 6 digit dikirim ke email terdaftar.', b: 'Kirim kode', f: [['u', 'Username atau email', 'text', 'autocapitalize=none']], l: [['login', 'Kembali ke Masuk'], ['reset', 'Saya sudah punya kode']] },
  reset: { t: 'Password baru', s: 'Masukkan kode dari email dan password baru.', b: 'Simpan password', f: [['u', 'Username atau email', 'text', 'autocapitalize=none'], ['k', 'Kode 6 digit', 'text', 'inputmode=numeric maxlength=6 autocomplete=one-time-code'], ['p', 'Password baru', 'password', 'autocomplete=new-password'], ['p2', 'Ulangi password baru', 'password', 'autocomplete=new-password']], l: [['lupa', 'Kirim ulang kode'], ['login', 'Kembali ke Masuk']] }
};
function authView(m, msg, ok) {
  AM = m; const d = M[m], ac = $('#ac'); ac.hidden = false; $('#ld').hidden = true; ac.classList.remove('shake');
  const hasPw = d.f.some(x => x[2] === 'password');
  ac.innerHTML = `<h2>${d.t}</h2><p class="sub">${d.s}</p><form id="af" novalidate>${d.f.map(([i, l, t, a]) => `<label class="f" for="f_${i}">${l}</label><input class="inp" id="f_${i}" type="${t}" ${a || ''}>`).join('')}${hasPw ? '<label class="chk"><input type="checkbox" id="sp"> Tampilkan password</label>' : ''}<div id="am" class="${msg ? (ok ? 'ok' : 'err') : ''}">${esc(msg || '')}</div><button class="btn" id="ab">${d.b}</button></form><div class="lk">${d.l.map(([k, l]) => `<a data-m="${k}">${l}</a>`).join('')}</div>`;
  if ((m === 'lupa' || m === 'reset') && $('#f_u')) $('#f_u').value = authId;
  $$('#ac [data-m]').forEach(a => a.onclick = () => { if ($('#f_u')) authId = $('#f_u').value.trim(); authView(a.dataset.m); });
  const sp = $('#sp'); if (sp) sp.onchange = () => $$('#af input[type=password],#af input[data-pw]').forEach(i => i.type = sp.checked ? 'text' : 'password');
  $$('#af input[type=password]').forEach(i => i.dataset.pw = 1);
  $('#af').onsubmit = authSubmit;
}
const amsg = (t, ok) => { const m = $('#am'); m.className = ok ? 'ok' : 'err'; m.textContent = t; };
async function authSubmit(ev) {
  ev.preventDefault(); const g = i => ($('#f_' + i) || {}).value || '';
  if ((AM === 'daftar' || AM === 'reset') && g('p') !== g('p2')) return amsg('Konfirmasi password tidak sama.');
  if (AM === 'login') return enterFlow(() => call('auth_login', g('u').trim(), g('p')));
  if (AM === 'daftar') return enterFlow(() => call('auth_register', { username: g('u').trim(), email: g('e').trim(), password: g('p'), kode: g('k').trim() }));
  const b = $('#ab'), t = b.textContent; b.disabled = true; b.textContent = 'Memproses…'; authId = g('u').trim();
  try {
    if (AM === 'lupa') authView('reset', await call('auth_requestReset', authId), true);
    else authView('login', await call('auth_confirmReset', authId, g('k').trim(), g('p')), true);
  } catch (e) { amsg(e.message); b.disabled = false; b.textContent = t; }
}
/* login -> loader jus -> ambil data -> masuk app */
async function enterFlow(getAuth) {
  ldOn();
  try {
    const r = await getAuth(); A = { token: r.token, user: r.username }; LS.s(TK, r.token);
    cap = 92; S = await call('api_getData'); saveS();
    await ldDone(); await sleep(350); start();
  } catch (e) {
    ldOff(); A = { token: '', user: '' }; LS.d(TK); authView(AM, e.message); $('#ac').classList.add('shake');
  }
}
function logout(msg) {
  LS.d(TK); LS.d(DK); A = { token: '', user: '' }; S = { produk: [], pemasukan: [], pengeluaran: [] }; killCh();
  $('#app').hidden = $('#nav').hidden = true; $('#auth').hidden = false; AM = 'login'; authView('login', msg);
}

/* ===== Data & periode ===== */
const aktif = () => S.produk.filter(p => p.aktif);
function range() {
  const t = today(), all = S.pemasukan.map(r => r.tanggal).concat(S.pengeluaran.map(r => r.tanggal)).sort();
  const start = period === '7' ? addDays(t, -6) : period === '30' ? addDays(t, -29) : period === 'bulan' ? t.slice(0, 8) + '01' : (all[0] || t);
  return { start, end: period === 'semua' && all.length && all[all.length - 1] > t ? all[all.length - 1] : t };
}
function agg(start, end) { // satu kali lewat data, bukan filter per hari -> ringan
  const days = [], ix = {}; for (let d = start; d <= end; d = addDays(d, 1)) { ix[d] = days.length; days.push(d); }
  const z = () => days.map(() => 0), m = { days, i: z(), o: z(), q: z(), per: {} };
  S.pemasukan.forEach(r => { const k = ix[r.tanggal]; if (k === undefined) return; m.i[k] += r.total; m.q[k] += r.qty; (m.per[r.jus] || (m.per[r.jus] = z()))[k] += r.qty; });
  S.pengeluaran.forEach(r => { const k = ix[r.tanggal]; if (k !== undefined) m.o[k] += r.jumlah; });
  return m;
}
const dl = (c, p) => period === 'semua' || !p ? '' : `<em class="${c >= p ? 'up' : 'down'}">${c >= p ? '▲' : '▼'} ${Math.abs(Math.round((c - p) / p * 100))}% dari periode lalu</em>`;
const kpi = (l, v, x, m) => `<div class="card kpi${m ? ' main' : ''}"><span>${l}</span><strong>${v}</strong>${x || ''}</div>`;
function bars(exp) {
  const tot = sum(exp, r => r.jumlah); if (!tot) return '<div class="empty">Belum ada pengeluaran pada periode ini.</div>';
  const by = {}; exp.forEach(r => by[r.kategori] = (by[r.kategori] || 0) + r.jumlah);
  return Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><small><span>${esc(k)}</span><span>${rp(v)} · ${Math.round(v / tot * 100)}%</span></small><i><u style="width:${v / tot * 100}%"></u></i></div>`).join('');
}

/* ===== Grafik: dibuat sekali, setelah itu di-update di tempat (tanpa destroy = tanpa kedip/lag) ===== */
Chart.defaults.font.family = 'Figtree,system-ui'; Chart.defaults.color = '#5d6e63';
Chart.defaults.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
const CH = {}, money = { ticks: { callback: v => v >= 1e6 ? v / 1e6 + ' jt' : v >= 1e3 ? v / 1e3 + ' rb' : v }, grid: { color: '#edf2ea' }, border: { display: false } };
const opt = (n, x = {}) => ({ maintainAspectRatio: false, animation: n > 150 ? false : { duration: 500, easing: 'easeOutQuart' }, interaction: { mode: 'index', intersect: false },
  scales: { y: { ...money, beginAtZero: true }, x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } } },
  plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + rp(c.parsed.y) } } }, ...x });
function chart(id, cfg) {

  if (c && c.canvas === el) {
    c.data.labels = cfg.data.labels;
    cfg.data.datasets.forEach((d, i) => c.data.datasets[i] ? Object.assign(c.data.datasets[i], d) : c.data.datasets.push(d));
    c.data.datasets.length = cfg.data.datasets.length; c.options.animation = cfg.options.animation; c.update();
  } else { if (c) c.destroy(); CH[id] = new Chart(el, cfg); }
}
const killCh = () => { Object.values(CH).forEach(c => c.destroy()); for (const k in CH) delete CH[k]; };

/* ===== Tampilan ===== */
const ICON = { ringkasan: '<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>', pemasukan: '<path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/>', pengeluaran: '<path d="M12 17V4m0 0L7 9m5-5l5 5M4 21h16"/>', riwayat: '<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8m0-4v4h4M12 7v5l3 2"/>', tren: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>' };
const LQ = {};
function formIn() {
  const l = aktif(); if (!l.find(p => p.nama === draft.jus)) { draft.jus = l[0] ? l[0].nama : ''; draft.harga = l[0] ? l[0].harga : 0; } draft.qty = 1;
  return `<div class="card"><h2>Penjualan baru</h2><p class="sub">Pilih rasa, atur jumlah, lalu simpan.</p>
  <div class="chips" id="chips">${l.map(p => `<button type="button" class="chip${p.nama === draft.jus ? ' on' : ''}" data-n="${esc(p.nama)}"><i style="background:${esc(p.warna)}"></i>${esc(p.nama)}</button>`).join('')}</div>
  <div class="row"><div><label class="f">Jumlah botol</label><div class="stp"><button type="button" id="mn">−</button><input class="inp" id="qty" type="number" min="1" value="1" inputmode="numeric"><button type="button" id="pl">+</button></div></div>
  <div><label class="f">Harga (Rp)</label><input class="inp" id="harga" type="number" min="0" value="${draft.harga}" inputmode="numeric"></div></div>
  <div class="row"><div><label class="f">Tanggal</label><input class="inp" id="tgl" type="date" value="${today()}"></div><div><label class="f">Metode</label><select class="inp" id="met">${METODE.map(m => `<option>${m}</option>`).join('')}</select></div></div>
  <label class="f">Catatan (opsional)</label><input class="inp" id="cat"><div class="tot"><span>Total</span><strong id="tot">${rp(draft.harga)}</strong></div><button class="btn" id="save">Simpan pemasukan</button></div>
  <div class="card"><h2>Terjual hari ini</h2><p class="sub" id="tt"></p><ul class="feed" id="tl"></ul></div>`;
}
const V = {
  ringkasan: ['Ringkasan', `<div class="rack" id="rack"></div><div class="g4" id="kpi"></div><div class="card"><h2>Pemasukan vs pengeluaran</h2><p class="sub" id="rg"></p><div class="cb"><canvas id="cTren"></canvas></div></div><div class="card"><h2>Aktivitas terbaru</h2><ul class="feed" id="feed"></ul></div><div class="card"><h2>Pengeluaran per kategori</h2><div id="bars"></div></div><div class="card"><h2>Metode pembayaran</h2><div class="cb sm"><canvas id="cMet"></canvas></div></div>`, 1],
  pemasukan: ['Pemasukan', formIn, 0],
  pengeluaran: ['Pengeluaran', () => `<div class="card"><h2>Pengeluaran baru</h2><p class="sub">Catat biaya agar laba bersih akurat.</p><label class="f">Kategori</label><select class="inp" id="kat">${KAT.map(k => `<option>${k}</option>`).join('')}</select><label class="f">Keterangan</label><input class="inp" id="ket"><div class="row"><div><label class="f">Jumlah (Rp)</label><input class="inp" id="jml" type="number" min="0" inputmode="numeric"></div><div><label class="f">Tanggal</label><input class="inp" id="tgl" type="date" value="${today()}"></div></div><button class="btn red" id="save">Simpan pengeluaran</button></div><div class="card"><h2>Pengeluaran terakhir</h2><p class="sub" id="tt"></p><ul class="feed" id="tl"></ul></div>`, 0],
  riwayat: ['Riwayat', () => `<div class="card"><div class="fl"><input class="inp" id="fq" placeholder="Cari catatan / metode…"><select class="inp" id="fj"><option value="">Semua rasa</option>${S.produk.map(p => `<option>${esc(p.nama)}</option>`).join('')}</select><input class="inp" id="ff" type="date" title="Dari"><input class="inp" id="ft" type="date" title="Sampai"></div><p class="sub" id="tt"></p><ul class="feed" id="tl"></ul></div>`, 0],
  tren: ['Tren Harian', `<div class="g4" id="kpi"></div><div class="card"><h2>Pemasukan, pengeluaran, laba</h2><p class="sub">Garis laba di bawah nol berarti hari itu rugi.</p><div class="cb"><canvas id="cT1"></canvas></div></div><div class="card"><h2>Botol terjual per rasa</h2><p class="sub">Rasa yang menggerakkan penjualan tiap hari</p><div class="cb"><canvas id="cT2"></canvas></div></div>`, 1]
};
function go(v) {
  view = v; killCh(); $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const m = V[v]; $('#title').textContent = m[0]; $('#period').hidden = !m[2];
  $('#view').innerHTML = typeof m[1] === 'function' ? m[1]() : m[1]; paint(); scrollTo(0, 0);
}
const paint = () => { $$('#period button').forEach(b => b.classList.toggle('on', b.dataset.p === period)); ({ ringkasan: pR, pemasukan: pP, pengeluaran: pE, riwayat: pH, tren: pT })[view](); };

function pR() {
  const { start, end } = range(), a = agg(start, end), n = a.days.length, f = r => r.tanggal >= start && r.tanggal <= end;
  const inc = S.pemasukan.filter(f), exp = S.pengeluaran.filter(f), pe = addDays(start, -1), ps = addDays(pe, -(n - 1)), g = r => r.tanggal >= ps && r.tanggal <= pe;
  const tin = sum(inc, r => r.total), to = sum(exp, r => r.jumlah), bt = sum(inc, r => r.qty), lb = tin - to;
  const pi = S.pemasukan.filter(g);
  const q = aktif().map(p => ({ ...p, q: sum(inc.filter(r => r.jus === p.nama), r => r.qty) })), mx = Math.max(1, ...q.map(x => x.q)), best = q.slice().sort((x, y) => y.q - x.q)[0];
  $('#rack').innerHTML = `<h2>${bt ? esc(best.nama) + ' paling laku' : 'Belum ada penjualan'}</h2><p>${bt ? bt.toLocaleString('id-ID') + ' botol terjual' : 'Catat penjualan di menu Pemasukan.'}</p><div class="shelf">${q.map(x => `<div class="glass${bt && x === best ? ' top1' : ''}"><b>${x.q}</b><div class="bt"><i class="cap"></i><i class="nk"></i><div class="bd"><div class="lq" data-n="${esc(x.nama)}" data-h="${x.q ? Math.max(6, x.q / mx * 100) : 0}" style="background:${esc(x.warna)};height:${LQ[x.nama] || 0}%"></div></div></div><span>${esc(x.nama)}</span></div>`).join('')}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $$('.lq').forEach(l => { l.style.height = l.dataset.h + '%'; LQ[l.dataset.n] = l.dataset.h; })));
  $('#kpi').innerHTML = kpi('Pemasukan', rp(tin), dl(tin, sum(pi, r => r.total))) + kpi('Pengeluaran', rp(to), dl(to, sum(S.pengeluaran.filter(g), r => r.jumlah))) + kpi('Laba bersih', rp(lb), `<em>${tin ? Math.round(lb / tin * 100) + '% dari pemasukan' : 'belum ada data'}</em>`, 1) + kpi('Botol terjual', bt.toLocaleString('id-ID'), dl(bt, sum(pi, r => r.qty)));
  $('#rg').textContent = tgl(start) + ' – ' + tgl(end);
  const feed = inc.map(r => ({ t: 1, k: r.tanggal + r.dibuat, r })).concat(exp.map(r => ({ t: 0, k: r.tanggal + r.dibuat, r }))).sort((x, y) => y.k.localeCompare(x.k)).slice(0, 6);
  $('#feed').innerHTML = feed.length ? feed.map(({ t, r }) => t ? `<li><div><b>${r.qty}× ${esc(r.jus)}</b><small>${tgl(r.tanggal)} · ${esc(r.metode)}</small></div><span class="amt in">+${rp(r.total)}</span></li>` : `<li><div><b>${esc(r.kategori)}</b><small>${tgl(r.tanggal)} · ${esc(r.keterangan || '-')}</small></div><span class="amt out">-${rp(r.jumlah)}</span></li>`).join('') : '<div class="empty">Belum ada transaksi pada periode ini.</div>';
  $('#bars').innerHTML = bars(exp);
  const dn = n > 31 ? 0 : 3;
  chart('cTren', { type: 'line', data: { labels: a.days.map(d => tgl(d)), datasets: [{ label: 'Pemasukan', data: a.i, borderColor: '#0f7a4a', backgroundColor: 'rgba(15,122,74,.12)', fill: true, tension: .35, pointRadius: dn }, { label: 'Pengeluaran', data: a.o, borderColor: '#e63757', tension: .35, pointRadius: dn }] }, options: opt(n) });
  chart('cMet', { type: 'doughnut', data: { labels: METODE, datasets: [{ data: METODE.map(m => sum(inc.filter(r => r.metode === m), r => r.total)), backgroundColor: ['#0f3d2a', '#c6f432', '#8fbf9f'], borderWidth: 2, borderColor: '#fff' }] }, options: { maintainAspectRatio: false, animation: { duration: 500 }, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } }, tooltip: { callbacks: { label: c => c.label + ': ' + rp(c.parsed) } } } } });
}
function pT() {
  const { start, end } = range(), a = agg(start, end), n = a.days.length, lb = a.i.map((v, k) => v - a.o[k]), act = a.days.map((d, k) => a.i[k] || a.o[k] || a.q[k]).filter(Boolean).length;
  const bi = a.i.indexOf(Math.max(...a.i)), tin = sum(a.i, x => x), tq = sum(a.q, x => x), dn = n > 31 ? 0 : 3;
  $('#kpi').innerHTML = kpi('Rata-rata pemasukan/hari', rp(act ? tin / act : 0), `<em>${act} hari ada transaksi</em>`) + kpi('Rata-rata botol/hari', (act ? tq / act : 0).toFixed(1).replace('.', ','), '<em>pada hari berjualan</em>') + kpi('Hari terbaik', a.i[bi] ? rp(a.i[bi]) : '-', `<em>${a.i[bi] ? tgl(a.days[bi], { weekday: 'long', day: 'numeric', month: 'short' }) : 'belum ada data'}</em>`, 1) + kpi('Laba periode', rp(sum(lb, x => x)), `<em>${tgl(start)} – ${tgl(end)}</em>`);
  const lbl = a.days.map(d => tgl(d)), zero = a.days.map(() => 0);
  chart('cT1', { data: { labels: lbl, datasets: [{ type: 'bar', label: 'Pemasukan', data: a.i, backgroundColor: '#0f7a4a', borderRadius: 4 }, { type: 'bar', label: 'Pengeluaran', data: a.o, backgroundColor: '#f2a3b0', borderRadius: 4 }, { type: 'line', label: 'Laba', data: lb, borderColor: '#14211a', tension: .3, pointRadius: dn, borderWidth: 2 }] }, options: opt(n, { scales: { y: money, x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } } } }) });
  chart('cT2', { type: 'bar', data: { labels: lbl, datasets: S.produk.map(p => ({ label: p.nama, backgroundColor: p.warna, data: a.per[p.nama] || zero })) }, options: opt(n, { scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } }, y: { stacked: true, beginAtZero: true, grid: { color: '#edf2ea' }, border: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } } }) });
}
const delBtn = (j, id) => `<button class="del" data-j="${j}" data-id="${esc(id)}">Hapus</button>`;
function pP() {
  const r = S.pemasukan.filter(x => x.tanggal === today()).reverse();
  $('#tt').textContent = r.length ? `${sum(r, x => x.qty)} botol · ${rp(sum(r, x => x.total))}` : '';
  $('#tl').innerHTML = r.length ? r.map(x => `<li><div><b>${x.qty}× ${esc(x.jus)}</b><small>${esc(x.metode)}</small></div><span class="amt in">+${rp(x.total)}</span>${delBtn('in', x.id)}</li>`).join('') : '<div class="empty">Belum ada penjualan hari ini.</div>';
}
function pE() {
  const r = S.pengeluaran.slice().sort((x, y) => (y.tanggal + y.dibuat).localeCompare(x.tanggal + x.dibuat)).slice(0, 30);
  $('#tt').textContent = r.length + ' terakhir';
  $('#tl').innerHTML = r.length ? r.map(x => `<li><div><b>${esc(x.kategori)}</b><small>${tgl(x.tanggal)} · ${esc(x.keterangan || '-')}</small></div><span class="amt out">-${rp(x.jumlah)}</span>${delBtn('out', x.id)}</li>`).join('') : '<div class="empty">Belum ada pengeluaran.</div>';
}
function pH() {
  const q = $('#fq').value.toLowerCase(), j = $('#fj').value, f = $('#ff').value, t = $('#ft').value;
  const rows = S.pemasukan.filter(r => (!j || r.jus === j) && (!f || r.tanggal >= f) && (!t || r.tanggal <= t) && (!q || (r.catatan + ' ' + r.metode + ' ' + r.jus).toLowerCase().includes(q))).sort((x, y) => (y.tanggal + y.dibuat).localeCompare(x.tanggal + x.dibuat));
  $('#tt').textContent = `${rows.length} transaksi · ${sum(rows, r => r.qty)} botol · ${rp(sum(rows, r => r.total))}`;
  $('#tl').innerHTML = rows.length ? rows.slice(0, 100).map(r => `<li><div><b>${r.qty}× ${esc(r.jus)}</b><small>${tgl(r.tanggal, { day: 'numeric', month: 'short', year: 'numeric' })} · ${esc(r.metode)}${r.catatan ? ' · ' + esc(r.catatan) : ''}</small></div><span class="amt in">${rp(r.total)}</span>${delBtn('in', r.id)}</li>`).join('') + (rows.length > 100 ? '<div class="empty">Menampilkan 100 terbaru. Persempit dengan filter.</div>' : '') : '<div class="empty">Tidak ada transaksi yang cocok.</div>';
}

/* ===== Aksi ===== */
async function sub(btn, fn, args, ok) {
  const t = btn.textContent; btn.disabled = true; btn.textContent = 'Menyimpan…';
  try { S = await call(fn, ...args); saveS(); toast(ok); paint(); return true; } catch (e) { toast(e.message, 1); return false; } finally { btn.disabled = false; btn.textContent = t; }
}
const upd = () => { draft.qty = Math.max(1, Number($('#qty').value) || 1); draft.harga = Number($('#harga').value) || 0; $('#tot').textContent = rp(draft.qty * draft.harga); };
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('chip')) { draft.jus = b.dataset.n; draft.harga = S.produk.find(p => p.nama === draft.jus).harga; $('#harga').value = draft.harga; $$('.chip').forEach(x => x.classList.toggle('on', x === b)); upd(); }
  else if (b.id === 'mn' || b.id === 'pl') { $('#qty').value = Math.max(1, (Number($('#qty').value) || 1) + (b.id === 'pl' ? 1 : -1)); upd(); }
  else if (b.id === 'save' && view === 'pemasukan') { upd(); if (await sub(b, 'api_addIncome', [{ jus: draft.jus, qty: draft.qty, harga: draft.harga, tanggal: $('#tgl').value, metode: $('#met').value, catatan: $('#cat').value }], `${draft.qty}× ${draft.jus} tersimpan`)) { $('#qty').value = 1; $('#cat').value = ''; upd(); } }
  else if (b.id === 'save') { if (await sub(b, 'api_addExpense', [{ kategori: $('#kat').value, keterangan: $('#ket').value, jumlah: $('#jml').value, tanggal: $('#tgl').value }], 'Pengeluaran tersimpan')) $('#ket').value = $('#jml').value = ''; }
  else if (b.classList.contains('del')) {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Yakin?'; setTimeout(() => { b.classList.remove('arm'); b.textContent = 'Hapus'; }, 3000); return; }
    b.disabled = true; try { S = await call('api_delete', b.dataset.j, b.dataset.id); saveS(); toast('Transaksi dihapus'); paint(); } catch (er) { toast(er.message, 1); b.disabled = false; }
  }
});
$('#view').addEventListener('input', e => { if (e.target.id === 'qty' || e.target.id === 'harga') upd(); else if (view === 'riwayat') pH(); });
$('#period').onclick = e => { const b = e.target.closest('button'); if (b) { period = b.dataset.p; paint(); } };
$('#out').onclick = () => logout('');
$('#rf').onclick = () => refresh(true);
async function refresh(manual) {
  const r = $('#rf'); r.classList.add('spin');
  try { S = await call('api_getData'); saveS(); paint(); if (manual) toast('Data diperbarui'); } catch (e) { if (manual) toast(e.message, 1); }
  r.classList.remove('spin');
}
function start(bg) {
  $('#auth').hidden = true; $('#app').hidden = $('#nav').hidden = false; $('#who').textContent = A.user;
  $('#nav').innerHTML = [['ringkasan', 'Ringkasan'], ['pemasukan', 'Jual'], ['pengeluaran', 'Biaya'], ['riwayat', 'Riwayat'], ['tren', 'Tren']].map(v => `<button data-v="${v[0]}"><svg viewBox="0 0 24 24">${ICON[v[0]]}</svg>${v[1]}</button>`).join('');
  $$('#nav button').forEach(b => b.onclick = () => go(b.dataset.v));
  const a = aktif()[0]; if (a) { draft.jus = a.nama; draft.harga = a.harga; }
  go('ringkasan'); if (bg) refresh();
}

/* ===== Mulai ===== */
(function boot() {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  const t = LS.g(TK); if (!t) return authView('login');
  A = { token: t, user: t.split(':')[1] || '' };
  const c = LS.g(DK); if (c) { try { S = JSON.parse(c); return start(true); } catch (e) {} }
  enterFlow(async () => ({ token: t, username: A.user }));
})();
</script>
