<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buah Tetangga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Buah Tetangga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#14211a;--mu:#5d6e63;--leaf:#0f3d2a;--l2:#16553a;--lime:#c6f432;--bg:#edf2ea;--line:#d9e2d6;--in:#0f7a4a;--out:#e63757;--soft:#f5f8f3;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.d{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
/* ===== Login ===== */
#auth{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#1d6b49,var(--leaf) 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + var(--st)) 20px calc(20px + var(--sb));overflow:auto;z-index:20}
.logo{width:min(230px,62vw);min-height:80px;display:grid;place-items:center;margin-bottom:18px;animation:pop 1.1s cubic-bezier(.34,1.56,.64,1) both,fl 3.2s 1.2s ease-in-out infinite}
.logo img{width:100%;max-height:130px;object-fit:contain}
.logo b{font:800 32px 'Bricolage Grotesque',sans-serif;color:var(--lime);text-align:center;line-height:1}
@keyframes pop{0%{transform:scale(0) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:none}}
@keyframes fl{50%{transform:translateY(-8px)}}
#ac{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:22px 22px 18px;animation:up .7s .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#ac.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#ac h2{font-size:22px;font-weight:800}
.err,.ok{border-radius:9px;padding:9px 12px;font-size:13.5px;margin-top:12px}
.err{background:#fde8ec;color:#a3112b}.ok{background:#e4f5ea;color:var(--in)}
.lk{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13.5px}
.lk a{color:var(--l2);font-weight:600;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--mu)}
/* ===== Loader jus ===== */
#ld{text-align:center;color:#fff}
#ld svg{width:170px;overflow:visible;display:block;margin:0 auto}
#fr{font-size:46px;height:56px;animation:bn .6s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(10px) rotate(8deg)}}
#pc{font:800 46px 'Bricolage Grotesque',sans-serif;color:var(--lime);margin-top:6px}
#jw{transition:fill .5s}
.wv{animation:wv 1.2s linear infinite}
@keyframes wv{to{transform:translateX(-60px)}}
/* ===== App ===== */
#app{max-width:1000px;margin:0 auto;padding:calc(14px + var(--st)) 14px calc(90px + var(--sb))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.top h1{font-size:26px;font-weight:800}
.who{color:var(--mu);font-size:13px;margin-right:6px}
.ib{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer}
.period{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;width:max-content;max-width:100%;overflow:auto}
.period button{border:0;background:0;padding:6px 13px;border-radius:999px;color:var(--mu);font-weight:500;white-space:nowrap}
.period button.on{background:var(--leaf);color:#fff}
#view>*{animation:fi .35s both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:14px}
.card h2{font-size:17px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{margin:0;padding:14px}.kpi span{color:var(--mu);font-size:13px}
.kpi strong{display:block;font:700 21px 'Bricolage Grotesque',sans-serif;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--mu)}.up{color:var(--in)!important}.down{color:var(--out)!important}
.kpi.main{background:var(--leaf);border-color:var(--leaf);color:#fff}.kpi.main strong{color:var(--lime)}.kpi.main span,.kpi.main em{color:#a9cdb7}
.rack{background:var(--leaf);color:#fff;border-radius:22px;padding:20px 18px 0;overflow:hidden;margin-top:14px}
.rack h2{font-size:26px;font-weight:800;line-height:1.1}.rack p{color:#a9cdb7}
.shelf{display:flex;gap:8px;align-items:flex-end;margin:16px 0 0;overflow-x:auto;padding-bottom:0}
.glass{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:4px}
.glass b{font:700 18px 'Bricolage Grotesque',sans-serif}.glass span{font-size:12px;color:#cfe5d6;padding-bottom:10px}
.glass.top1 span{color:var(--lime);font-weight:600}
.bt{width:44px;display:flex;flex-direction:column;align-items:center}
.cap{width:20px;height:8px;background:#fff;border-radius:3px 3px 1px 1px}
.nk{width:17px;height:18px;border:2px solid #ffffffbf;border-bottom:0}
.bd{width:44px;height:84px;position:relative;overflow:hidden;border:2px solid #ffffffbf;border-radius:20px 20px 10px 10px/24px 24px 10px 10px;background:#ffffff12}
.bd::after{content:"";position:absolute;left:0;right:0;top:46%;height:24%;background:#ffffff8c}
.lq{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.shelf::after{content:"";flex:none}
.cb{position:relative;height:260px}.cb.sm{height:220px}canvas{touch-action:pan-y}
.feed{list-style:none}.feed li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef2ec}
.feed li:last-child{border:0}.feed b{display:block;font-weight:600}.feed small{color:var(--mu)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.empty{padding:26px 8px;text-align:center;color:var(--mu)}
.bar{margin-top:9px}.bar small{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:3px}
.bar i{display:block;height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;background:var(--out);border-radius:9px;transition:width .8s}
label.f{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px}
.inp{width:100%;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.inp:focus{outline:0;border-color:var(--l2);background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:500}
.chip i{width:13px;height:13px;border-radius:50%;border:1px solid #0003}.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stp{display:flex;gap:6px}.stp button{width:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px}.stp input{text-align:center;font-weight:700}
.tot{margin-top:14px;background:var(--soft);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.tot strong{font:700 23px 'Bricolage Grotesque',sans-serif}
.btn{width:100%;margin-top:14px;background:var(--leaf);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6}.btn.red{background:var(--out)}
.del{background:0;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:4px 10px;font-size:12.5px}
.del.arm{background:var(--out);border-color:var(--out);color:#fff}
.pr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef2ec;flex-wrap:wrap}.pr:last-child{border:0}.pr .tag{flex:1 1 100%;display:flex;align-items:center;gap:7px;font-weight:600}.pr .tag i{width:11px;height:11px;border-radius:50%;border:1px solid #0003}.pr .inp{flex:1;min-width:90px;width:auto}.pr input[type=color]{width:44px;height:42px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft)}.btn.sm{width:auto;margin:0;padding:10px 16px;font-size:14px}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.fl .inp{flex:1;min-width:130px;width:auto}
#nav{position:fixed;left:0;right:0;bottom:0;max-width:1000px;margin:0 auto;display:flex;background:var(--leaf);padding:6px 6px calc(6px + var(--sb));border-radius:18px 18px 0 0;z-index:10}
#nav button{flex:1;background:0;border:0;color:#bcd8c6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:7px 2px;border-radius:12px}
#nav button.on{background:var(--lime);color:var(--leaf);font-weight:600}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.e{background:var(--out)}
.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ===== Pemesanan ===== */
#nav{overflow-x:auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
#nav button{flex:1 0 auto;min-width:62px;position:relative}
.bdg{position:absolute;top:1px;left:calc(50% + 5px);background:var(--out);color:#fff;font:600 10px Figtree,sans-serif;border-radius:9px;padding:1px 5px;min-width:16px;text-align:center}.bdg:empty{display:none}
.av{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2ec}.av:last-child{border:0}
.av .tag{display:flex;align-items:center;gap:8px;font-weight:600}.av .tag i{width:12px;height:12px;border-radius:50%;border:1px solid #0003;flex:none}
.av small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.sb{padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sb.ok{background:#e4f5ea;color:var(--in)}.sb.low{background:#fff3d6;color:#8a5a00}.sb.no{background:#fde8ec;color:#a3112b}.sb.na{background:var(--soft);color:var(--mu)}
.chip.off{opacity:.45;text-decoration:line-through}
.hint{font-size:13px;color:var(--mu);margin-top:8px}.hint.bad{color:var(--out)}
.pay{margin-top:10px;background:var(--soft);border:1px dashed var(--line);border-radius:14px;padding:4px 12px}
.pay .bk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e8eee5}.pay .bk:last-child{border:0}
.pay small{display:block;color:var(--mu);font-size:12px}.pay b{font:700 17px 'Bricolage Grotesque',sans-serif;letter-spacing:.02em}
.cp{background:var(--leaf);color:#fff;border:0;border-radius:9px;padding:6px 13px;font-size:13px;font-weight:600;flex:none}
.od{padding:12px 0;border-bottom:1px solid #eef2ec}.od:last-child{border:0}
.od .oh{display:flex;justify-content:space-between;align-items:center;gap:10px}.od small{display:block;color:var(--mu)}
.od .cd{color:var(--l2);font-weight:600}.od .cd.off{color:var(--mu);font-weight:400}
.st{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.wait{background:#fff3d6;color:#8a5a00}.st.ok{background:#e4f5ea;color:var(--in)}.st.no{background:#fde8ec;color:#a3112b}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.blw{margin:6px 0}.bli{display:flex;gap:6px;margin-bottom:6px;align-items:center}.bli input{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-width:0}.bli .bn{flex:1}.bli .bv{width:112px;text-align:right}.bx{border:0;background:transparent;font-size:24px;line-height:1;color:var(--out);padding:0 6px;cursor:pointer}
.mb{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer}
.mb.arm,.btn.arm{background:var(--out);border-color:var(--out);color:#fff}
.btn.gh{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.pay-d summary{cursor:pointer;color:var(--l2);font-weight:600;font-size:13.5px;margin-top:8px}
.pr .su{flex:1 1 100%;color:var(--mu);font-size:12px}
/* nav admin 2 baris supaya semua menu terlihat */
#nav.adm{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;gap:2px}
#nav.adm button{min-width:0}
#app.adm{padding-bottom:calc(150px + var(--sb))}
body.adm #toast{bottom:calc(150px + var(--sb))}
/* daftar varian 1 baris + stepper */
.vr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eef2ec}.vr:last-child{border:0}
.vn{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vn i{width:12px;height:12px;border-radius:50%;border:1px solid #0003;flex:none}.vn em{font-style:normal;font-weight:400;color:var(--mu)}
.vs{display:flex;align-items:center;gap:3px;flex:none}
.vs button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1;cursor:pointer}
.vs b{min-width:22px;text-align:center;font-weight:700}
.vr.on .vn{color:var(--l2)}.vr.on .vs button:last-child{background:var(--leaf);border-color:var(--leaf);color:#fff}
.vr.off .vs{opacity:.3;pointer-events:none}.vr .sb{min-width:64px;text-align:center;flex:none;padding:4px 6px;font-size:12px}
.it{display:flex;justify-content:space-between;gap:10px;font-weight:500;padding:2px 0}
.sw{position:relative;overflow:hidden;border-radius:8px}.swa{position:absolute;top:0;right:0;bottom:0;width:88px;display:flex}.swb{flex:1;border:0;background:var(--out);color:#fff;font-weight:600;font-size:13px;cursor:pointer}.swb.arm{background:#8f1d2c}.swc{position:relative;background:#fff;padding:6px 2px;transition:transform .18s;touch-action:pan-y;user-select:none;-webkit-user-select:none}.sw.open .swc{transform:translateX(-88px)}.sw.drag .swc{transition:none}.sw+.sw{border-top:1px solid #eef2ec}
/* stok: geser ke samping */
.sk{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0 12px}
.skc{min-width:0;background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.skc .tag{display:flex;align-items:center;gap:7px;font-weight:600;margin-bottom:8px}.skc .tag i{width:12px;height:12px;border-radius:50%;border:1px solid #0003;flex:none}
.skc .stp{display:flex;gap:4px}.skc .stp button{width:34px;flex:none}.skc .stp input{min-width:0;padding:8px 2px}
.skc .su{display:block;margin-top:7px;color:var(--mu);font-size:12px}
.gg{margin-top:12px}.gg:first-child{margin-top:0}
.gg>.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:2px}
.gg>.gh b{font:700 16px 'Bricolage Grotesque',sans-serif}.gg>.gh span{color:var(--mu);font-size:12.5px}
.od a{color:var(--l2);font-weight:600}
#pnm::placeholder,#ptl::placeholder{font-size:13px}
.gr{display:flex;align-items:center;gap:8px}.gr .mb{color:var(--ink)}
#toast{z-index:50}
#rc{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.rcb{background:#fff;border-radius:18px;padding:14px;max-width:420px;width:100%;max-height:100%;overflow:auto}
.rcb img{width:100%;border:1px solid var(--line);border-radius:10px;display:block}
.rcb .btn{display:block;text-align:center;text-decoration:none;margin-top:8px}

/* ===== Tabel Pesanan / Status Pembayaran / Biaya ===== */
.g5>:nth-child(5){grid-column:1/-1}
@media(min-width:760px){.g5{grid-template-columns:repeat(5,1fr)}.g5>:nth-child(5){grid-column:auto}}
#nav.adm button{line-height:1.15;text-align:center}
.th,.tr,.tb{display:grid;grid-template-columns:var(--cols);gap:6px 8px;align-items:center}
.cols3{--cols:minmax(0,1fr) 110px 64px}
.cols4{--cols:96px minmax(0,1fr) 76px 100px}
.cols5{--cols:96px minmax(0,1fr) 76px 100px 150px}
.th{position:sticky;top:var(--st);z-index:5;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:5px 13px 5px 17px;margin:6px 0 2px;font-size:12px;font-weight:600;color:var(--mu)}
.th span{padding:5px 0;min-width:0}.th .r{text-align:right}
.th button{background:0;border:0;padding:5px 0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:3px;line-height:1.15;min-width:0}
.th button.on{color:var(--leaf)}
.th button i{font-style:normal;font-size:10px;opacity:.35}.th button.on i{opacity:1}
.od.adm,.od.adm:last-child{border:1px solid var(--line);border-left:5px solid var(--c);background:var(--t);border-radius:14px;padding:10px 12px;margin-top:10px}
.od.adm .tr{font-size:14px;font-weight:500;align-items:start}
.od.adm .tr b{font-weight:700;word-break:break-word}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.nw{white-space:nowrap}
.od .swc{background:var(--t,#fff)}.od.adm .sw+.sw{border-top:1px solid #0000000f}
.tr .c5{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
select.bs{width:auto;max-width:100%;padding:6px 12px 6px 10px;border-radius:10px;font-weight:600}
select.bs.ok{background-color:#e4f5ea;border-color:#9fd3b4;color:var(--in)}
select.bs.no{background-color:#fde8ec;border-color:#f0a9b6;color:#a3112b}
.pn{font-size:11.5px;color:var(--mu);line-height:1.25}
.tb{padding:10px 13px 10px 17px;border-bottom:1px solid #eef2ec}.tb:last-child{border:0}
.tb b{display:block;font-weight:600}.tb small{color:var(--mu);word-break:break-word}
.tb .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.tb .a{text-align:right}
@media(max-width:560px){
.cols3{--cols:minmax(0,1fr) 92px 58px}
.cols4{--cols:60px minmax(0,1fr) 52px 64px}
.cols5{--cols:60px minmax(0,1fr) 52px 64px}
.th.cols5 .c5{grid-column:1/-1;justify-content:flex-end}
.tr.cols5 .c5{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-end;gap:8px}
}
</style>
</head>
<body>
<div id="auth">
  <div class="logo"><img src="https://lh3.googleusercontent.com/d/1HWOv0ozL_wmo7z8rm45eTB0n3J6nbUfM" alt="Buah Tetangga" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><b hidden>BUAH<br>TETANGGA</b></div>
  <div id="ac"></div>
  <div id="ld" hidden>
    <div id="fr">🍓</div>

  chart('cT2', { type: 'bar', data: { labels: lbl, datasets: S.produk.map(p => ({ label: p.nama, backgroundColor: p.warna, data: a.per[p.nama] || zero })) }, options: opt(n, { scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } }, y: { stacked: true, beginAtZero: true, grid: { color: '#edf2ea' }, border: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } } }) });
}
const delBtn = (j, id, l) => `<button class="del" data-j="${j}" data-id="${esc(id)}"${l ? ' data-l="1"' : ''}>Hapus</button>`;
const dt2 = s => /^\d{4}-\d{2}-\d{2}/.test(s || '') ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4) + ' ' + s.slice(11, 16) : '';
function pE() {
  const r = S.pengeluaran.slice().sort((x, y) => (y.tanggal + y.dibuat).localeCompare(x.tanggal + x.dibuat)).slice(0, 30);
  $('#tt').textContent = r.length + ' terakhir';
  setH($('#tl'), r.length ? r.map(x => `<div class="tb cols3"><div><b>${esc(x.kategori)}</b><small>${tgl(x.tanggal)} · ${esc(x.keterangan || '-')}</small></div><span class="amt out n">-${rp(x.jumlah)}</span><span class="a">${delBtn('out', x.id)}</span></div>`).join('') : '<div class="empty">Belum ada pengeluaran.</div>');
}
function pH() {
  const q = $('#fq').value.toLowerCase(), j = $('#fj').value, f = $('#ff').value, t = $('#ft').value;
  const rows = S.pemasukan.filter(r => (!j || r.jus === j) && (!f || r.tanggal >= f) && (!t || r.tanggal <= t) && (!q || (r.catatan + ' ' + r.metode + ' ' + r.jus).toLowerCase().includes(q))).sort((x, y) => (y.tanggal + y.dibuat).localeCompare(x.tanggal + x.dibuat));
  const om = {}; grp().forEach(o => { om[o.grup] = o; });
  const li = r => {
    const ref = r.grup || ((String(r.catatan).match(/\(#([^)]+)\)\s*$/) || [])[1] || '');
    const tg = tgl(r.tanggal, { day: 'numeric', month: 'short', year: 'numeric' });
    if (!ref) return `<li><div><b>${r.qty}× ${esc(r.jus)}</b><small>${tg} · ${esc(r.metode)}${r.catatan ? ' · ' + esc(r.catatan) : ''}</small></div><span class="amt in">${rp(r.total)}</span>${delBtn('in', r.id)}</li>`;
    // dari Pesanan (Dikonfirmasi): baris 1 = qty rasa - nama - tanggal untuk; baris 2 = metode · (#kode) · jam pesan
    const o = om[ref], nm = o ? o.pembeli : ((String(r.catatan).match(/^Pesanan (.*) \(#/) || [])[1] || '');
    return `<li><div><b>${r.qty}× ${esc(r.jus)}${nm ? ' - ' + esc(nm) : ''} - ${tg}</b><small>${esc(r.metode)} · (#${esc(ref)})${o && o.dibuat ? ' · ' + dt2(o.dibuat) : ''}</small></div><span class="amt in">${rp(r.total)}</span>${delBtn('in', r.id, 1)}</li>`;
  };
  $('#tt').textContent = `${rows.length} transaksi · ${sum(rows, r => r.qty)} botol · ${rp(sum(rows, r => r.total))}`;
  $('#tl').innerHTML = rows.length ? rows.slice(0, 100).map(li).join('') + (rows.length > 100 ? '<div class="empty">Menampilkan 100 terbaru. Persempit dengan filter.</div>' : '') : '<div class="empty">Tidak ada transaksi yang cocok.</div>';
}

/* ===== Aksi ===== */
async function sub(btn, fn, args, ok) {
  const t = btn.textContent; btn.disabled = true; btn.textContent = 'Menyimpan…';
  try { S = await call(fn, ...args); saveS(); toast(ok); paint(); return true; } catch (e) { toast(e.message, 1); return false; } finally { btn.disabled = false; btn.textContent = t; }
}
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'gopes') { ofil = 'Menunggu'; return go('pesanan'); }
  if (b.id === 'gobay') { bfil = 'Sudah Bayar'; return go('bayar'); }
  if (view === 'pesan' || view === 'pesanan' || view === 'bayar' || view === 'stok') return orderClick(b);
  if (b.id === 'save') { if (await sub(b, 'api_addExpense', [{ kategori: $('#kat').value, keterangan: $('#ket').value, jumlah: $('#jml').value, tanggal: $('#tgl').value }], 'Pengeluaran tersimpan')) $('#ket').value = $('#jml').value = ''; }
  else if (b.dataset.s !== undefined) { const n = b.dataset.s, q = a => document.querySelector(`input[${a}="${CSS.escape(n)}"]`); await sub(b, 'api_savePrice', [n, q('data-n').value, q('data-c').value], n + ' diperbarui'); }
  else if (b.dataset.p !== undefined) {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Yakin?'; setTimeout(() => { b.classList.remove('arm'); b.textContent = 'Hapus'; }, 3000); return; }
    const n = b.dataset.p; if (await sub(b, 'api_deleteProduct', [n], 'Rasa ' + n + ' dihapus')) go('harga');
  }
  else if (b.id === 'addP') { const n = $('#nn').value.trim(); if (await sub(b, 'api_addProduct', [n, $('#nh').value, $('#nc').value], 'Rasa ' + n + ' ditambahkan')) go('harga'); }
  else if (b.classList.contains('del')) {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Yakin?'; setTimeout(() => { b.classList.remove('arm'); b.textContent = 'Hapus'; }, 3000); return; }
    b.disabled = true; try { S = await call('api_delete', b.dataset.j, b.dataset.id); saveS(); toast(b.dataset.l ? 'Dihapus dari Riwayat & Pesanan' : 'Transaksi dihapus'); paint(); } catch (er) { toast(er.message, 1); b.disabled = false; }
  }
});
$('#view').addEventListener('input', e => { if (view === 'riwayat') pH(); });
$('#view').addEventListener('change', e => { const s = e.target.closest && e.target.closest('select[data-by]'); if (s) setBayar(s); });
/* biaya lain-lain: simpan otomatis (debounce) tanpa menggambar ulang kartu saat mengetik */
let bTimer = 0, bBusy = 0, bSeq = 0;
const bRead = w => [...w.querySelectorAll('.bli')].map(r => ({ n: r.querySelector('.bn').value.trim(), v: Math.max(0, Math.round(Number(r.querySelector('.bv').value) || 0)) })).filter(x => x.v > 0).map(x => ({ n: x.n || 'Biaya lain-lain', v: x.v }));
const bApply = w => { const l = bRead(w), s = l.reduce((t, x) => t + x.v, 0); S.pesanan.forEach(r => { if ((r.grup || r.id) === w.dataset.g) { r.bl = l; r.biaya = s; } }); inval(); };
function bTotal(w) { const t = w.closest('.od').querySelector('.otot'); if (t) t.textContent = rp(Number(w.dataset.sub) + bRead(w).reduce((s, x) => s + x.v, 0)); }
function bSave(w, now) {
  clearTimeout(bTimer);
  const run = () => {
    bTimer = 0; bApply(w); saveS(); const my = ++bSeq; bBusy++;
    call('api_pesanBiaya', w.dataset.g, bRead(w)).then(d => { if (my === bSeq) { S = d; saveS(); } }).catch(er => toast(er.message, 1)).finally(() => { bBusy--; });
  };
  if (now) run(); else bTimer = setTimeout(run, 700);
}
$('#view').addEventListener('input', e => { const w = e.target.closest && e.target.closest('.blw'); if (!w) return; bTotal(w); bSave(w); });
/* geser item pesanan ke kiri -> tombol Hapus (admin, menu Pesanan) */
(function () {
  const v = $('#view'), W = 88; let el = null, sx = 0, sy = 0, dx = 0, mode = 0, base = 0;
  v.addEventListener('pointerdown', e => {
    if (view !== 'pesanan' || e.target.closest('.swb')) return;
    const s = e.target.closest('.sw');
    const o = v.querySelector('.sw.open'); if (o && o !== s) { o.classList.remove('open'); swOpen = ''; }
    if (!s) return;
    el = s; sx = e.clientX; sy = e.clientY; dx = 0; mode = 0; base = s.classList.contains('open') ? -W : 0;
  });
  v.addEventListener('pointermove', e => {
    if (!el) return; const mx = e.clientX - sx, my = e.clientY - sy;
    if (!mode) {
      if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { mode = 1; el.classList.add('drag'); try { el.setPointerCapture(e.pointerId); } catch (_) {} }
      else { if (Math.abs(my) > 8) el = null; return; }
    }
    dx = Math.max(-W, Math.min(0, base + mx)); el.querySelector('.swc').style.transform = 'translateX(' + dx + 'px)';
  });
  const end = () => {
    if (!el) return; const s = el; el = null; if (!mode) return;
    s.classList.remove('drag'); s.querySelector('.swc').style.transform = '';
    const open = dx < -W / 2; s.classList.toggle('open', open); swOpen = open ? s.dataset.sw : (swOpen === s.dataset.sw ? '' : swOpen);
  };
  v.addEventListener('pointerup', end); v.addEventListener('pointercancel', end);
})();
$('#period').onclick = e => { const b = e.target.closest('button'); if (b) { period = b.dataset.p; paint(); } };
$('#out').onclick = () => A.role === 'admin' ? logout('') : showLogin();
$('#view').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'snm') $('#scari').click(); });
$('#rf').onclick = () => refresh(true);
async function refresh(manual) {
  if (pend && !manual) return; // jangan menimpa perubahan yang sedang disimpan
  const r = $('#rf'); r.classList.add('spin');
  try { S = A.role === 'admin' ? await call('api_getData') : await call('pub_getData', qNama); saveS(); if (S.role && S.role !== A.role) { A.role = S.role; start(); } else paint(); if (A.role === 'admin' && (S.ver || 0) < 9) toast('Backend Apps Script belum versi terbaru. Deploy > Manage deployments > New version.', 1); else if (manual) toast('Data diperbarui'); } catch (e) { if (manual) toast(e.message, 1); }

}
const NAVL = { ringkasan: 'Ringkasan', pengeluaran: 'Biaya', riwayat: 'Riwayat', tren: 'Tren', harga: 'Harga', pesan: 'Pesan', pesanan: 'Pesanan', bayar: 'Status Pembayaran', stok: 'Stok' };

  $$('#nav button').forEach(b => b.onclick = () => { if (b.dataset.v === 'pesan') editId = null; go(b.dataset.v); });
  ofil = adm ? 'Menunggu' : 'Semua'; bfil = 'Semua'; olim = blim = 100; editId = null;
  go(adm ? 'ringkasan' : 'pesan'); if (bg) refresh();
  if (adm) setTimeout(() => { rcLogo(); try { document.fonts.load('14px Figtree'); document.fonts.load('italic 13px Figtree'); } catch (e) {} }, 300); // siapkan logo & font lebih awal supaya recipt cepat
}

/* Pesanan masuk / status pesanan diperbarui otomatis tiap 1 menit; hitung mundur batas edit tiap 30 detik */
let tick = 0;
setInterval(() => { if (!A.role || $('#app').hidden || document.hidden) return; tick++; if (view === 'pesanan' && A.role !== 'admin') pOrd(); if (tick % 2 === 0) refresh(); }, 30000);

/* ===== Mulai ===== */
(function boot() {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  const t = LS.g(TK); if (!t) return guestEnter();
  A = { token: t, user: t.split(':')[1] || '', role: '' };
  const c = LS.g(DK); if (c) { try { S = JSON.parse(c); if (S.role) { A.role = S.role; if (!S.pesanan) S.pesanan = []; return start(true); } } catch (e) {} }
  enterFlow(async () => ({ token: t, username: A.user }));
})();
